name: Avisos al móvil

# Lo lanza cron-job.org cada 5 minutos (job «Apex Quant Avisos»).
# El «schedule» de GitHub queda de respaldo por si cron-job.org falla.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Recuperar lo ya avisado (rama avisos-estado)
        run: |
          git fetch --depth=1 origin +refs/heads/avisos-estado:refs/remotes/origin/avisos-estado 2>/dev/null && git show origin/avisos-estado:avisos_estado.json > avisos_estado.json 2>/dev/null || echo "Primera vez: sin estado previo"

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install --quiet pywebpush requests

      - name: Mandar avisos
        env:
          APEX_PUSH: ${{ secrets.APEX_PUSH }}
        run: python avisos.py

      # El estado se guarda en una rama aparte para no reconstruir la web en cada vuelta
      - name: Guardar lo avisado
        run: |
          [ -f avisos_estado.json ] || exit 0
          cp avisos_estado.json /tmp/avisos_estado.json
          rm -f avisos_estado.json
          git config user.name "apex-avisos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet origin/avisos-estado >/dev/null; then
            git checkout -B avisos-estado origin/avisos-estado
          else
            git checkout --orphan avisos-estado
            git rm -rf --cached --quiet . || true
          fi
          cp /tmp/avisos_estado.json avisos_estado.json
          git add avisos_estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit --quiet -m "Avisos: estado"
            git push --quiet origin avisos-estado
          fi
